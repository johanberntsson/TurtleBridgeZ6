# Turtle Bridge's pictures, for the Ozmoo z6 build.
#
# Read by make_blorb.py: "python make_blorb.py resources" writes turtlebridge.blb
# and the converted PNGs in pics/. The numbers match the old drakmagi.bli, so
# picture N is the view from room RN and the game's picture properties are just
# the room numbers.
#
# Source images are found beside this file (srcdir defaults to the folder
# holding it); override with a "srcdir:" line if they live elsewhere.

blorb:  turtlebridge.blb
outdir: pics
scale: 2

# id and file are mandatory; name, location, width and height are optional.
# All 66 pictures are 224x72 PETSCII screens from the 1987 C64 version, which
# already fits inside the 320x200 v6 screen, so no width/height cap is needed
# here -- make_blorb.py never upscales.
#
# Pictures 46 and 47 are the two rooms the 2003 rewrite dropped along with the
# maze. They are kept so that every other picture keeps its historical number.
pictures:
  - id: 1
    file: backdrop.png
